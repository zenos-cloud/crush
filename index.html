<!doctype html>
<html lang="vi">
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Thư gửi Quyên</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"
/>
<style>
  /* Layout: một lá thư nhiều trang, mỗi lần chạm lật sang trang mới; ảnh trái – chữ phải trên màn rộng, xếp chồng trên điện thoại */
  :root {
    --bg: #f5eef3; /* giấy hồng tím nhạt */
    --paper: #fffbfd; /* mặt thư */
    --ink: #2b1a2f; /* mực tím than */
    --muted: #7b6a80;
    --line: #e7dce4;
    --accent: #d3406a; /* hồng đậm */
    --accent-ink: #ffffff;
    --shade: rgba(60, 20, 50, 0.1);
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --body: "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17101b;
      --paper: #221827;
      --ink: #f4eaf1;
      --muted: #b4a3b8;
      --line: #3a2c40;
      --accent: #ff6f96;
      --accent-ink: #2b0e1a;
      --shade: rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17101b;
    --paper: #221827;
    --ink: #f4eaf1;
    --muted: #b4a3b8;
    --line: #3a2c40;
    --accent: #ff6f96;
    --accent-ink: #2b0e1a;
    --shade: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 24px;
    box-sizing: border-box;
  }
  .top {
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bar {
    flex: 1;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.5s ease;
  }
  .count {
    font-variant-numeric: tabular-nums;
  }

  .letter {
    flex: 1;
    max-width: 920px;
    width: 100%;
    margin: 18px auto;
    background: var(--paper);
    box-shadow:
      0 1px 0 var(--line),
      0 24px 60px -30px var(--shade);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    display: flex;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .page {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    gap: clamp(24px, 5vw, 56px);
    align-items: center;
    padding: clamp(24px, 5vw, 60px);
  }
  .page.textonly {
    grid-template-columns: minmax(0, 1fr);
    max-width: 620px;
    margin: 0 auto;
    text-align: left;
  }
  .page.cover {
    grid-template-columns: minmax(0, 1fr);
    text-align: center;
    justify-items: center;
    max-width: 640px;
    margin: 0 auto;
  }
  .page.quiz {
    grid-template-columns: minmax(0, 1fr);
    max-width: 640px;
    margin: 0 auto;
    text-align: left;
  }
  .page.enter {
    animation: in 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .page.enter.back {
    animation-name: inback;
  }
  @keyframes in {
    from {
      opacity: 0;
      transform: translateX(18px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  @keyframes inback {
    from {
      opacity: 0;
      transform: translateX(-18px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .page.enter {
      animation: none;
    }
    .bar i {
      transition: none;
    }
  }

  .photo {
    margin: 0;
    justify-self: center;
    width: 100%;
    max-width: 340px;
    transform: rotate(-1.5deg);
  }
  .photo .frame {
    background: var(--paper);
    padding: 10px 10px 0;
    box-shadow:
      0 2px 0 var(--line),
      0 18px 40px -18px var(--shade);
    border: 1px solid var(--line);
  }
  .photo img,
  .photo .ph {
    display: block;
    width: 100%;
    aspect-ratio: 4/5;
    object-fit: cover;
    max-width: 100%;
  }
  .ph {
    background:
      radial-gradient(
        120% 80% at 20% 10%,
        color-mix(in srgb, var(--accent) 22%, transparent),
        transparent 60%
      ),
      radial-gradient(
        90% 70% at 90% 100%,
        color-mix(in srgb, var(--accent) 14%, var(--line)),
        transparent 70%
      ),
      var(--bg);
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
  .photo .ph {
    display: grid;
  }
  .photo figcaption {
    font-family: var(--display);
    font-style: italic;
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    padding: 10px 4px 12px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
    font-weight: 600;
  }
  h1,
  h2 {
    font-family: var(--display);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  h1 {
    font-size: clamp(38px, 7vw, 64px);
  }
  h2 {
    font-size: clamp(28px, 4.4vw, 40px);
  }
  h1 em,
  h2 em {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }
  .text {
    min-width: 0;
  }
  .text p {
    margin: 0 0 14px;
    max-width: 46ch;
    color: var(--ink);
  }
  .text p.soft {
    color: var(--muted);
  }
  .cover .text p {
    margin-inline: auto;
  }
  .list {
    list-style: none;
    padding: 0;
    margin: 4px 0 0;
    display: grid;
    gap: 12px;
  }
  .list li {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 8px;
    align-items: baseline;
  }
  .list li svg {
    width: 14px;
    height: 14px;
    fill: var(--accent);
    transform: translateY(2px);
  }
  .sign {
    font-family: var(--display);
    font-style: italic;
    font-size: 20px;
    margin-top: 18px;
    color: var(--ink);
  }
  .heart {
    width: 44px;
    height: 44px;
    fill: var(--accent);
    margin-bottom: 14px;
  }

  /* Ô câu hỏi (trang type "quiz"): mỗi câu một ô, các lựa chọn nằm ngay bên dưới câu hỏi */
  .qs {
    display: grid;
    gap: 16px;
    margin-top: 8px;
  }
  .q {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px 12px;
    background: color-mix(in srgb, var(--bg) 45%, var(--paper));
    cursor: default;
  }
  .q h3 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 20px;
    line-height: 1.3;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .opts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .opt {
    font: inherit;
    font-size: 14px;
    line-height: 1.3;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    transition:
      border-color 0.15s,
      background 0.15s,
      color 0.15s;
  }
  .opt:hover {
    border-color: var(--accent);
  }
  .opt[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .said {
    margin: 10px 0 0;
    min-height: 1.6em;
    font-family: var(--display);
    font-style: italic;
    font-size: 16px;
    color: var(--accent);
  }

  .btns {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 22px;
  }
  .cover .btns {
    justify-content: center;
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  .btn {
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    transition:
      transform 0.15s ease,
      filter 0.15s;
  }
  .btn:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
  }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
  }
  .reply {
    margin-top: 16px;
    font-family: var(--display);
    font-style: italic;
    font-size: 19px;
    color: var(--accent);
    min-height: 1.6em;
  }

  .copy {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    cursor: default;
  }
  .copy .note {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .copybox {
    margin: 12px 0 0;
    padding: 12px 14px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: var(--ink);
    user-select: all;
  }

  .nav {
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .arrow {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    display: grid;
    place-items: center;
    transition:
      border-color 0.15s,
      opacity 0.2s;
  }
  .arrow:hover {
    border-color: var(--accent);
  }
  .arrow:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .arrow svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 0;
    padding: 0;
    background: var(--line);
    transition:
      background 0.2s,
      width 0.25s;
  }
  .dot[aria-current="true"] {
    background: var(--accent);
    width: 22px;
    border-radius: 5px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.04em;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (max-width: 700px) {
    .page {
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
    }
    .photo {
      max-width: 260px;
    }
  }
</style>

<div class="stage">
  <div class="top" aria-hidden="true">
    <span>Thư gửi Chị</span>
    <div class="bar"><i id="bar"></i></div>
    <span class="count" id="count">1 / 1</span>
  </div>
  <main class="letter" id="letter" aria-live="polite"></main>
  <nav class="nav" aria-label="Chuyển trang">
    <button class="arrow" id="prev" aria-label="Trang trước">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="Trang sau">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
    </button>
  </nav>
  <p class="hint">Chạm vào lá thư hoặc dùng phím ← → để lật trang</p>
</div>

<script>
  /* ===========================================================

       q: câu hỏi
       options: các lựa chọn hiện ngay bên dưới câu hỏi
       reply: câu đáp lại sau khi người đọc chọn

  const FROM = "Long"; // tên người gửi

      caption: "Buồn",
      text: [

  /* =================== HẾT PHẦN SỬA NỘI DUNG =================== */

  const $ = (id) => document.getElementById(id);
  const letter = $("letter"),
    dots = $("dots");
  let cur = 0;
  const answers = {}; // câu trả lời đã chọn: "số trang-số câu" -> số thứ tự lựa chọn
  let askAnswer = ""; // lựa chọn ở trang cuối

  const heart =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.2.3.8.3 1 0 .7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';

  function esc(s) {
    return String(s).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
    );
  }

  function render(dir) {
    const p = PAGES[cur];
    const hasImg = "image" in p;
    const cls = [
      "page",
      "enter",
      dir < 0 ? "back" : "",
      p.type === "cover"
        ? "cover"
        : p.type === "quiz"
          ? "quiz"
          : !hasImg
            ? "textonly"
            : "",
    ].join(" ");
    let html = `<section class="${cls}">`;
    if (hasImg) {
      html +=
        `<figure class="photo"><div class="frame">` +
        (p.image
          ? `<img src="${esc(p.image)}" alt="${esc(p.caption || "")}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;ph&quot;>Ảnh sẽ ở đây</div>'">`
          : `<div class="ph">Ảnh sẽ ở đây</div>`) +
        `</div>${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}</figure>`;
    }
    html += `<div class="text">`;
    if (p.type === "cover" || p.type === "ask")
      html += `<div class="heart-wrap">${heart.replace("<svg", '<svg class="heart"')}</div>`;
    if (p.eyebrow) html += `<p class="eyebrow">${esc(p.eyebrow)}</p>`;
    html += p.type === "cover" ? `<h1>${p.title}</h1>` : `<h2>${p.title}</h2>`;
    (p.text || []).forEach(
      (t, i) =>
        (html += `<p${p.type === "cover" ? ' class="soft"' : ""}>${esc(t)}</p>`),
    );
    if (p.list)
      html += `<ul class="list">${p.list.map((t) => `<li>${heart}<span>${esc(t)}</span></li>`).join("")}</ul>`;
    if (p.type === "quiz") {
      html +=
        `<div class="qs">` +
        p.questions
          .map((q, qi) => {
            const chosen = answers[cur + "-" + qi];
            return (
              `<div class="q" role="group" aria-labelledby="q${cur}-${qi}">` +
              `<h3 id="q${cur}-${qi}">${esc(q.q)}</h3>` +
              `<div class="opts">` +
              q.options
                .map(
                  (o, oi) =>
                    `<button class="opt" data-act="pick" data-q="${qi}" data-o="${oi}" aria-pressed="${chosen === oi}">${esc(o)}</button>`,
                )
                .join("") +
              `</div>` +
              `<p class="said" id="said-${qi}">${chosen !== undefined ? esc(q.reply || "Em nhớ rồi nhé!") : ""}</p>` +
              `</div>`
            );
          })
          .join("") +
        `</div>`;
    }
    if (p.type === "cover")
      html += `<div class="btns"><button class="btn" data-act="next">${esc(p.button)}</button></div>`;
    if (p.type === "ask") {
      html +=
        `<div class="btns"><button class="btn" data-act="yes">${esc(p.yes)}</button>` +
        `<button class="btn ghost" data-act="no">${esc(p.no)}</button></div><p class="reply" id="reply"></p>`;
      if (askAnswer)
        html = html.replace(
          '<p class="reply" id="reply"></p>',
          `<p class="reply" id="reply">${esc(askAnswer === "yes" ? p.yesReply : p.noReply)}</p>`,
        );
      if (p.copyButton) {
        html +=
          `<div class="copy"><p class="note" id="copynote">${esc(p.copyNote || "")}</p>` +
          `<button class="btn ghost" data-act="copy">${esc(p.copyButton)}</button>` +
          `<pre class="copybox" id="copybox" hidden></pre></div>`;
      }
      if (p.sign) html += `<p class="sign">${esc(p.sign)}</p>`;
    }
    html += `</div></section>`;
    letter.innerHTML = html;

    $("count").textContent = `${cur + 1} / ${PAGES.length}`;
    $("bar").style.width = ((cur + 1) / PAGES.length) * 100 + "%";
    $("prev").disabled = cur === 0;
    $("next").disabled = cur === PAGES.length - 1;
    [...dots.children].forEach((d, i) =>
      d.setAttribute("aria-current", i === cur),
    );
  }

  function go(i) {
    if (i < 0 || i >= PAGES.length || i === cur) return;
    const dir = i > cur ? 1 : -1;
    cur = i;
    render(dir);
  }

  /* Gom các câu trả lời thành một đoạn chữ để người đọc gửi lại */
  function buildAnswers() {
    const lines = ["Câu trả lời của chị:"];
    PAGES.forEach((pg, pi) => {
      if (pg.type !== "quiz") return;
      pg.questions.forEach((q, qi) => {
        const o = answers[pi + "-" + qi];
        lines.push(
          `- ${q.q} ${o !== undefined ? q.options[o] : "(chưa chọn)"}`,
        );
      });
    });
    const ask = PAGES.find((pg) => pg.type === "ask");
    if (ask) {
      lines.push(
        `- ${ask.title.replace(/<[^>]+>/g, "")} ${askAnswer === "yes" ? ask.yes : askAnswer === "no" ? ask.no : "(chưa chọn)"}`,
      );
    }
    return lines.join("\n");
  }

  PAGES.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "dot";
    b.setAttribute("aria-label", `Trang ${i + 1}`);
    b.onclick = () => go(i);
    dots.appendChild(b);
  });

  $("prev").onclick = () => go(cur - 1);
  $("next").onclick = () => go(cur + 1);

  letter.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    const act = el ? el.dataset.act : undefined;
    const p = PAGES[cur];
    if (act === "pick") {
      const qi = +el.dataset.q,
        oi = +el.dataset.o;
      answers[cur + "-" + qi] = oi;
      el.parentElement
        .querySelectorAll(".opt")
        .forEach((b, i) => b.setAttribute("aria-pressed", i === oi));
      $("said-" + qi).textContent = p.questions[qi].reply || "Em nhớ rồi nhé!";
      return;
    }
    if (act === "yes") {
      askAnswer = "yes";
      $("reply").textContent = p.yesReply;
      return;
    }
    if (act === "no") {
      askAnswer = "no";
      $("reply").textContent = p.noReply;
      return;
    }
    if (act === "copy") {
      const txt = buildAnswers();
      const box = $("copybox"),
        note = $("copynote");
      box.textContent = txt;
      box.hidden = false;
      const fallback = () => {
        note.textContent =
          "Chị chọn đoạn chữ bên dưới rồi sao chép gửi cho em nhé.";
      };
      try {
        navigator.clipboard.writeText(txt).then(() => {
          note.textContent =
            "Đã sao chép. Chị dán vào tin nhắn gửi cho em nhé.";
        }, fallback);
      } catch (err) {
        fallback();
      }
      return;
    }
    if (act === "next") {
      go(cur + 1);
      return;
    }
    if (p.type === "ask" || p.type === "quiz") return; // trang có nút bấm: không lật khi chạm
    const r = letter.getBoundingClientRect();
    e.clientX - r.left < r.width * 0.3 ? go(cur - 1) : go(cur + 1);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });

  let sx = null;
  letter.addEventListener("touchstart", (e) => (sx = e.touches[0].clientX), {
    passive: true,
  });
  letter.addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 50) {
      e.preventDefault();
      go(cur + (dx < 0 ? 1 : -1));
    }
  });

  render(1);
</script>
