<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thư Halloween</title>
    <!-- Font hỗ trợ tiếng Việt: Baloo 2 (tiêu đề), Patrick Hand (chữ viết tay) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ========== 1. MÀU (đổi màu cả trang chỉ cần sửa ở đây) ========== */
      :root {
        --night: #24163a; /* tím đêm */
        --pumpkin: #ff7a1a; /* cam bí ngô */
        --pumpkin-dark: #e0600a;
        --bone: #fff4e0; /* trắng xương */
        --moon: #ffd23f; /* vàng trăng */
        --grape: #7b4bb7; /* tím nho */
        --candy: #ff6fae; /* hồng kẹo */
        --slime: #8fd14f; /* xanh chất nhờn */
      }

      /* ========== 2. CƠ BẢN (viết cho điện thoại trước) ========== */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        overflow-x: clip;
      } /* chặn cuộn ngang */
      body {
        min-height: 100svh;
        font-family: "Patrick Hand", cursive;
        color: var(--night);
        overflow-x: hidden;
        background: radial-gradient(
            circle at 50% 20%,
            #3a2560,
            var(--night) 70%
          )
          fixed;
      }
      h1,
      h2 {
        font-family: "Baloo 2", sans-serif;
        line-height: 1.15;
      }
      button {
        font-family: "Baloo 2", sans-serif;
        cursor: pointer;
      }

      .btn {
        font-weight: 800;
        font-size: 1.05rem;
        padding: 10px 24px;
        border: 3px solid var(--night);
        border-radius: 999px;
        background: var(--pumpkin);
        color: var(--night);
        box-shadow: 4px 4px 0 var(--night);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--night);
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--night);
      }
      .btn:disabled {
        opacity: 0.35;
        pointer-events: none;
      }

      /* ========== 3. TRANG TRÍ NỀN: sao nhấp nháy, trăng, dơi bay ngang, lá rơi ========== */
      .sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: twinkle 2.5s ease-in-out infinite;
      }
      @keyframes twinkle {
        50% {
          opacity: 0.15;
          transform: scale(0.5);
        }
      }

      .moon {
        position: fixed;
        top: 24px;
        right: -36px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--moon);
        box-shadow: 0 0 70px var(--moon);
        animation: glow 4s ease-in-out infinite;
      }
      @keyframes glow {
        50% {
          box-shadow: 0 0 110px 10px var(--moon);
        }
      }

      /* Dơi bay ngang qua màn hình */
      .fly-bat {
        position: fixed;
        width: 46px;
        left: -60px;
        animation: cross 11s linear infinite;
      }
      .fly-bat.f2 {
        top: 70%;
        width: 34px;
        animation-duration: 15s;
        animation-delay: -6s;
      }
      .fly-bat.f1 {
        top: 14%;
      }
      .fly-bat svg {
        animation: flap 0.3s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes cross {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(30vw, -30px);
        }
        50% {
          transform: translate(60vw, 20px);
        }
        75% {
          transform: translate(90vw, -20px);
        }
        100% {
          transform: translate(calc(100vw + 120px), 0);
        }
      }
      @keyframes flap {
        to {
          transform: scaleY(0.6);
        }
      }

      /* Lá / sao rơi (JS tạo ra) */
      .fall {
        position: absolute;
        top: -40px;
        font-size: 20px;
        animation: fall linear infinite;
        opacity: 0.85;
      }
      @keyframes fall {
        to {
          transform: translate(var(--x, 40px), 110vh) rotate(360deg);
        }
      }

      /* ========== 4. SÂN KHẤU: phong bì và lá thư nằm chồng ở giữa ========== */
      .stage {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 70px 16px 60px;
      }
      .stage > * {
        grid-area: 1 / 1;
      }

      /* ========== 5. PHONG BÌ ========== */
      .envelope-wrap {
        text-align: center;
        color: var(--bone);
        transition:
          opacity 0.5s,
          transform 0.6s,
          visibility 0.5s;
      }
      .envelope-wrap h1 {
        font-size: clamp(1.8rem, 7vw, 2.6rem);
        margin-bottom: 70px;
        animation: bounce 2s ease-in-out infinite;
      }
      @keyframes bounce {
        50% {
          transform: translateY(-8px);
        }
      }

      .envelope {
        position: relative;
        width: min(86vw, 380px);
        aspect-ratio: 3 / 2;
        margin: 0 auto 36px;
        perspective: 1000px;
        animation: wiggle 3s ease-in-out infinite; /* phong bì lắc nhẹ như muốn mở */
      }
      @keyframes wiggle {
        0%,
        80%,
        100% {
          transform: rotate(0);
        }
        84% {
          transform: rotate(-3deg);
        }
        88% {
          transform: rotate(3deg);
        }
        92% {
          transform: rotate(-2deg);
        }
        96% {
          transform: rotate(2deg);
        }
      }
      .is-open .envelope {
        animation: none;
      }

      .env-back {
        position: absolute;
        inset: 0;
        background: var(--pumpkin-dark);
        border: 4px solid var(--night);
        border-radius: 12px;
        box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.35);
      }
      .env-letter {
        position: absolute;
        left: 8%;
        right: 8%;
        top: 8%;
        height: 84%;
        background: var(--bone);
        border: 3px solid var(--night);
        border-radius: 8px;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding-top: 14px;
        font-size: 1.4rem;
        color: var(--night);
        transition: transform 0.6s;
      }
      .env-front {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
      }
      .flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 62%;
        z-index: 4;
        transform-origin: top center;
        transition:
          transform 0.6s 0.4s,
          z-index 0s 0.7s;
      }
      /* Con dấu sáp = nút mở */
      .seal {
        position: absolute;
        left: 50%;
        top: 52%;
        z-index: 5;
        width: 74px;
        height: 74px;
        margin: -37px 0 0 -37px;
        border-radius: 50%;
        border: 4px solid var(--night);
        background: var(--grape);
        color: var(--moon);
        font-size: 1.1rem;
        font-weight: 800;
        animation: pulse 1.6s ease-in-out infinite;
        transition: transform 0.35s 1s;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.7);
        }
        100% {
          box-shadow: 0 0 0 18px rgba(255, 210, 63, 0);
        }
      }

      /* --- Trạng thái ĐÃ MỞ --- */
      .is-open .seal {
        transform: scale(0) rotate(180deg);
        transition: transform 0.35s;
        animation: none;
      }
      .is-open .flap {
        transform: rotateX(180deg);
        z-index: 1;
        transition:
          transform 0.6s 0.2s,
          z-index 0s 0.5s;
      }
      .is-open .env-letter {
        transform: translateY(-65%);
        transition: transform 0.8s 0.7s;
      }
      /* --- Trạng thái ĐANG ĐỌC --- */
      .reading .envelope-wrap {
        opacity: 0;
        visibility: hidden;
        transform: translateY(120px) scale(0.8);
      }

      /* Pháo kẹo bung ra khi mở thư (JS tạo ra) */
      .burst {
        position: fixed;
        z-index: 20;
        font-size: 26px;
        pointer-events: none;
        animation: burst 1.3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }
      @keyframes burst {
        0% {
          transform: translate(-50%, -50%) scale(0.2);
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by)))
            scale(1.2) rotate(var(--br));
          opacity: 0;
        }
      }

      /* ========== 6. LÁ THƯ LỚN ========== */
      .letter-card {
        position: relative;
        width: min(92vw, 560px);
        height: min(74svh, 600px);
        perspective: 1400px;
        opacity: 0;
        visibility: hidden;
        transform: scale(0.3) translateY(120px);
        transition:
          opacity 0.4s,
          transform 0.5s,
          visibility 0.4s;
      }
      .reading .letter-card {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity 0.4s 0.2s,
          transform 0.8s 0.2s cubic-bezier(0.2, 1.5, 0.4, 1),
          visibility 0s;
      }
      .pages {
        position: absolute;
        inset: 0 0 64px 0;
        background: var(--bone);
        background-image: repeating-linear-gradient(
          transparent 0 35px,
          #f0dcc0 35px 37px
        ); /* giấy kẻ dòng */
        border: 4px solid var(--night);
        border-radius: 20px;
        box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.35);
      }
      .page {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 30px 26px;
        overflow-y: auto;
        background: inherit;
        border-radius: 16px;
        backface-visibility: hidden;
      }
      .page.active,
      .page.leaving {
        display: flex;
      }
      .page-art {
        width: 110px;
        height: 110px;
        flex-shrink: 0;
        margin-bottom: 10px;
      }
      .page.active .page-art {
        animation:
          popUp 0.6s 0.3s cubic-bezier(0.2, 1.8, 0.4, 1) both,
          sway 3s 1s ease-in-out infinite;
      }
      @keyframes sway {
        50% {
          transform: rotate(6deg) translateY(-6px);
        }
      }
      .page h2 {
        font-size: clamp(1.6rem, 6.5vw, 2.3rem);
        color: var(--grape);
        margin-bottom: 10px;
        min-height: 1.2em;
      }
      .page p {
        font-size: clamp(1.2rem, 4.6vw, 1.45rem);
        line-height: 1.5;
        max-width: 420px;
        white-space: pre-line;
      }
      .page .sign {
        margin-top: auto;
        padding-top: 16px;
        align-self: flex-end;
        font-size: 1.4rem;
        color: var(--pumpkin-dark);
      }

      /* Con trỏ nhấp nháy khi chữ đang được "gõ" */
      .typing::after {
        content: "|";
        margin-left: 2px;
        color: var(--pumpkin);
        animation: blink 0.6s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* Hiệu ứng LẬT TRANG 3D */
      .out-next {
        transform-origin: left center;
        animation: outNext 0.6s ease-in forwards;
        z-index: 2;
      }
      .in-next {
        transform-origin: right center;
        animation: inNext 0.6s ease-out;
      }
      .out-prev {
        transform-origin: right center;
        animation: outPrev 0.6s ease-in forwards;
        z-index: 2;
      }
      .in-prev {
        transform-origin: left center;
        animation: inPrev 0.6s ease-out;
      }
      @keyframes outNext {
        to {
          transform: rotateY(-100deg);
          opacity: 0;
        }
      }
      @keyframes inNext {
        from {
          transform: rotateY(60deg);
          opacity: 0;
        }
      }
      @keyframes outPrev {
        to {
          transform: rotateY(100deg);
          opacity: 0;
        }
      }
      @keyframes inPrev {
        from {
          transform: rotateY(-60deg);
          opacity: 0;
        }
      }

      /* Thanh điều khiển */
      .nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .nav .btn {
        padding: 6px 18px;
      }
      .dots {
        display: flex;
        gap: 8px;
      }
      .dots span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--bone);
        opacity: 0.4;
        transition: 0.3s;
      }
      .dots span.on {
        opacity: 1;
        background: var(--moon);
        transform: scale(1.3);
      }
      .close-btn {
        position: absolute;
        top: -50px;
        left: 0;
        z-index: 6;
        font-size: 0.9rem;
        padding: 4px 14px;
        background: var(--bone);
        box-shadow: 3px 3px 0 var(--night);
      }

      /* ========== 7. HÌNH NỔI quanh lá thư (bấm vào sẽ nhảy lên) ========== */
      .pop {
        position: absolute;
        z-index: 5;
        cursor: pointer;
        transform: scale(0);
        -webkit-tap-highlight-color: transparent;
      }
      .reading .pop {
        animation:
          popUp 0.7s var(--d) cubic-bezier(0.2, 1.8, 0.4, 1) both,
          bob 3s calc(var(--d) + 0.7s) ease-in-out infinite;
      }
      .reading .pop.jump {
        animation: jump 0.6s ease-out;
      }
      @keyframes popUp {
        from {
          transform: scale(0) rotate(-40deg);
        }
        to {
          transform: scale(1) rotate(var(--r, 0deg));
        }
      }
      @keyframes bob {
        0%,
        100% {
          transform: scale(1) rotate(var(--r, 0deg)) translateY(0);
        }
        50% {
          transform: scale(1) rotate(var(--r, 0deg)) translateY(-10px);
        }
      }
      @keyframes jump {
        0% {
          transform: scale(1) rotate(var(--r, 0deg));
        }
        40% {
          transform: scale(1.3) rotate(calc(var(--r, 0deg) + 20deg))
            translateY(-30px);
        }
        100% {
          transform: scale(1) rotate(var(--r, 0deg));
        }
      }
      /* Điện thoại: hình nằm sát mép trong, không tràn ra ngoài màn hình */
      .p-ghost {
        width: 64px;
        top: 4px;
        left: -8px;
        --d: 0.6s;
        --r: -12deg;
      }
      .p-bat {
        width: 70px;
        top: 10px;
        right: -6px;
        --d: 0.75s;
        --r: 10deg;
      }
      .p-pumpkin {
        width: 76px;
        bottom: 40px;
        right: -6px;
        --d: 0.9s;
        --r: 8deg;
      }
      .p-candy {
        width: 60px;
        bottom: 50px;
        left: -8px;
        --d: 1.05s;
        --r: -20deg;
      }
      /* Mắt bí ngô lập lòe như có nến bên trong */
      .p-pumpkin .eye {
        animation: flicker 1.2s infinite;
      }
      @keyframes flicker {
        0%,
        100% {
          fill: #24163a;
        }
        30% {
          fill: #ffd23f;
        }
        60% {
          fill: #ff9640;
        }
      }

      /* ========== 8. MÀN HÌNH LỚN ========== */
      @media (min-width: 768px) {
        .p-ghost {
          width: 110px;
          top: -30px;
          left: -60px;
        }
        .p-bat {
          width: 110px;
          top: -10px;
          right: -60px;
        }
        .p-pumpkin {
          width: 120px;
          right: -64px;
        }
        .p-candy {
          width: 90px;
          left: -52px;
        }
        .page {
          padding: 40px 48px;
        }
        .page-art {
          width: 140px;
          height: 140px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }

      /* Chữ ký + con rồng nằm cùng hàng ở góc dưới bên phải */
      .ky-ten {
        margin-top: auto;
        align-self: flex-end;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-right: 50px; /* điện thoại: tránh bị bí ngô che */
      }
      @media (min-width: 768px) {
        .ky-ten {
          margin-right: 0;
        }
      }
      .page .ky-ten .sign {
        margin-top: 0;
      }
      .rong {
        width: 80px;
        animation: sway 2s ease-in-out infinite; /* rồng đung đưa nhẹ */
      }
    </style>
  </head>
  <body>
    <!-- Trang trí nền -->
    <div class="sky" id="sky"></div>
    <div class="moon"></div>
    <div class="fly-bat f1">
      <svg viewBox="0 0 120 50">
        <path
          d="M60 18c-8-14-30-20-58-8 10 4 14 12 12 22 10-8 22-6 26 4 6-6 14-6 20 2 6-8 14-8 20-2 4-10 16-12 26-4-2-10 2-18 12-22-28-12-50-6-58 8z"
          fill="#120a20"
        />
      </svg>
    </div>
    <div class="fly-bat f2">
      <svg viewBox="0 0 120 50">
        <path
          d="M60 18c-8-14-30-20-58-8 10 4 14 12 12 22 10-8 22-6 26 4 6-6 14-6 20 2 6-8 14-8 20-2 4-10 16-12 26-4-2-10 2-18 12-22-28-12-50-6-58 8z"
          fill="#120a20"
        />
      </svg>
    </div>

    <main class="stage" id="stage">
      <!-- ========== PHONG BÌ ========== -->
      <div class="envelope-wrap">
        <h1 id="heading"></h1>
        <div class="envelope" id="envelope">
          <div class="env-back"></div>
          <div class="env-letter" id="envLabel"></div>
          <svg
            class="env-front"
            viewBox="0 0 300 200"
            preserveAspectRatio="none"
          >
            <path
              d="M2 2 L150 115 L298 2 V198 H2Z"
              fill="#ff7a1a"
              stroke="#24163a"
              stroke-width="4"
              stroke-linejoin="round"
            />
            <path
              d="M2 198 L128 98 M298 198 L172 98"
              stroke="#24163a"
              stroke-width="4"
            />
          </svg>
          <svg class="flap" viewBox="0 0 300 124" preserveAspectRatio="none">
            <path
              d="M2 2 H298 L150 122Z"
              fill="#ff9640"
              stroke="#24163a"
              stroke-width="4"
              stroke-linejoin="round"
            />
          </svg>
          <button class="seal js-open" aria-label="Mở thư">Mở</button>
        </div>
        <button class="btn js-open" id="openBtn"></button>
      </div>

      <!-- ========== LÁ THƯ LỚN ========== -->
      <div class="letter-card" id="card">
        <button class="btn close-btn js-close">✉️ Gấp thư</button>

        <!-- Hình nổi (bấm vào để chúng nhảy) -->
        <svg class="pop p-ghost" viewBox="0 0 200 200">
          <path
            d="M50 178V92a50 50 0 0 1 100 0v86l-17-14-16 14-17-14-17 14-16-14z"
            fill="#fff"
            stroke="#24163a"
            stroke-width="7"
            stroke-linejoin="round"
          />
          <ellipse cx="82" cy="95" rx="9" ry="13" fill="#24163a" />
          <ellipse cx="118" cy="95" rx="9" ry="13" fill="#24163a" />
          <ellipse cx="100" cy="128" rx="11" ry="9" fill="#24163a" />
        </svg>
        <svg class="pop p-bat" viewBox="0 0 120 60">
          <path
            d="M60 22c-8-14-30-20-58-8 10 4 14 12 12 22 10-8 22-6 26 4 6-6 14-6 20 2 6-8 14-8 20-2 4-10 16-12 26-4-2-10 2-18 12-22-28-12-50-6-58 8z"
            fill="#7b4bb7"
            stroke="#24163a"
            stroke-width="3"
          />
          <circle cx="54" cy="24" r="3" fill="#ffd23f" />
          <circle cx="66" cy="24" r="3" fill="#ffd23f" />
        </svg>
        <svg class="pop p-pumpkin" viewBox="0 0 200 200">
          <ellipse
            cx="100"
            cy="122"
            rx="82"
            ry="64"
            fill="#ff7a1a"
            stroke="#24163a"
            stroke-width="7"
          />
          <ellipse
            cx="100"
            cy="122"
            rx="36"
            ry="64"
            fill="none"
            stroke="#24163a"
            stroke-width="5"
          />
          <path
            d="M96 60q4-26 22-32"
            stroke="#3c7a2a"
            stroke-width="12"
            fill="none"
            stroke-linecap="round"
          />
          <polygon class="eye" points="62,108 86,108 74,88" />
          <polygon class="eye" points="114,108 138,108 126,88" />
          <path class="eye" d="M60 132Q100 176 140 132Z" />
        </svg>
        <svg class="pop p-candy" viewBox="0 0 200 200">
          <polygon
            points="55,100 15,70 15,130"
            fill="#ff6fae"
            stroke="#24163a"
            stroke-width="7"
            stroke-linejoin="round"
          />
          <polygon
            points="145,100 185,70 185,130"
            fill="#ff6fae"
            stroke="#24163a"
            stroke-width="7"
            stroke-linejoin="round"
          />
          <circle
            cx="100"
            cy="100"
            r="48"
            fill="#ff6fae"
            stroke="#24163a"
            stroke-width="7"
          />
          <path
            d="M70 80q30 40 60 0M70 120q30-40 60 0"
            stroke="#fff4e0"
            stroke-width="7"
            fill="none"
          />
        </svg>

        <!-- Các trang thư: JavaScript tự tạo từ phần NỘI DUNG THƯ bên dưới -->
        <div class="pages" id="pages"></div>

        <div class="nav">
          <button class="btn js-prev" aria-label="Trang trước">←</button>
          <div class="dots" id="dots"></div>
          <button class="btn js-next" aria-label="Trang sau">→</button>
        </div>
      </div>
    </main>

    <script>
      /* =====================================================================
       ✏️ NỘI DUNG THƯ – MUỐN ĐỔI CHỮ THÌ CHỈ SỬA Ở ĐÂY
       - Xuống dòng: dùng \n
       - hinh: chọn 1 trong 'trang', 'mu', 'den', 'ma', 'keo'
       - ky: chữ ký viết cạnh con rồng (để trống "" thì chỉ có con rồng)
       - Muốn thêm trang: copy 1 khối { ... }, nhớ có dấu phẩy giữa các khối
       ===================================================================== */
      const NOI_DUNG = {
        tieuDe: "Bạn đã 'bị' nhận 1 lời nhắn 👻",
        nhanThu: "Gửi chị 🎃",
        nutMo: "✉️ Xem Thật     ",
        trang: [
          {
            hinh: "trang",
            tieuDe: "Gửi chị không phải của em 👻",
            noiDung:
              "Nhân ngày chẳng có gì đặc biệt\nEm cũng chẳng biết nên nói gì với chị\nNói nhiều thỳ sợ phiền chị, mà không làm gì thỳ sợ lại hối tiếc, haizz 🤧🤧",
            ky: "",
          },
          {
            hinh: "mu",
            tieuDe: " 🎃",
            noiDung:
              "Và thế là hôm nay em lại phải phiền chị thêm 1 tý vậy.😀😀\n Chị cho cũng được không cho thỳ em cũng làm mất rồi.🫠 \n  ",
            ky: "",
          },
          {
            hinh: "den",
            tieuDe: " Chúc chị có 1 ngày halloween vui vẻ!!🍬",
            noiDung:
              "Có nhiều thứ em muốn nói với chị\n Nhưng chắc chỉ đến đây thôi chị ạ!!   ",
            ky: "",
          },
        ],
      };

      /* Tốc độ gõ chữ (mili giây cho mỗi chữ cái). Số càng nhỏ càng nhanh */
      const TOC_DO_GO = 35;

      /* =====================================================================
       Các hình vẽ dùng cho trang thư (SVG)
       ===================================================================== */
      /* Con rồng nhỏ dùng làm chữ ký ở góc dưới mỗi trang */
      const RONG =
        // Viền chung cho mọi hình: màu tím đậm, dày 2.5
        '<svg class="rong" viewBox="0 0 120 100" stroke="#24163a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">' +
        // đuôi: vẽ nét to màu tối làm viền, rồi nét nhỏ màu xanh đè lên
        '<path d="M42 82 Q12 88 12 66 Q12 52 26 55" fill="none" stroke-width="11"/>' +
        '<path d="M42 82 Q12 88 12 66 Q12 52 26 55" fill="none" stroke="#3cc6b8" stroke-width="6"/>' +
        '<path d="M26 55 L20 44 L32 50 Z" fill="#ff8fb8"/>' + // mũi đuôi
        // cánh
        '<path d="M48 56 Q34 30 48 16 Q52 30 62 32 Q60 44 62 54 Z" fill="#a7ece4"/>' +
        '<path d="M48 20 Q50 36 58 50" fill="none" stroke-width="1.5"/>' +
        // thân + bụng có sọc
        '<ellipse cx="56" cy="70" rx="22" ry="20" fill="#3cc6b8"/>' +
        '<ellipse cx="63" cy="74" rx="12" ry="14" fill="#fff4e0"/>' +
        '<path d="M54 68 H72 M53 75 H73 M55 82 H71" fill="none" stroke-width="1.5"/>' +
        // 2 chân + tay
        '<ellipse cx="46" cy="89" rx="9" ry="5" fill="#3cc6b8"/>' +
        '<ellipse cx="68" cy="90" rx="9" ry="5" fill="#3cc6b8"/>' +
        '<ellipse cx="74" cy="68" rx="5" ry="7" fill="#3cc6b8"/>' +
        // gai lưng
        '<path d="M40 56 L36 49 L45 52 M36 64 L30 59 L39 60" fill="#ff8fb8"/>' +
        // 2 sừng cong
        '<path d="M68 22 Q60 8 68 2 Q68 12 75 19 Z" fill="#ffd23f"/>' +
        '<path d="M82 19 Q84 5 93 3 Q88 12 88 21 Z" fill="#ffd23f"/>' +
        // đầu + mõm
        '<circle cx="77" cy="38" r="20" fill="#3cc6b8"/>' +
        '<ellipse cx="94" cy="45" rx="13" ry="10" fill="#3cc6b8"/>' +
        // mắt: lòng trắng, con ngươi, đốm sáng
        '<ellipse cx="80" cy="35" rx="6" ry="7" fill="#fff"/>' +
        '<circle cx="82" cy="36" r="4" fill="#24163a" stroke="none"/>' +
        '<circle cx="83.5" cy="34" r="1.5" fill="#fff" stroke="none"/>' +
        // má hồng, 2 lỗ mũi, miệng cười
        '<ellipse cx="86" cy="49" rx="4" ry="2.5" fill="#ff8fb8" stroke="none" opacity=".7"/>' +
        '<circle cx="100" cy="41" r="1.2" fill="#24163a" stroke="none"/>' +
        '<circle cx="104" cy="43" r="1.2" fill="#24163a" stroke="none"/>' +
        '<path d="M93 51 Q98 54 104 50" fill="none" stroke-width="2"/>' +
        // đốm lửa nhỏ
        '<path d="M107 47 Q113 39 119 40 Q115 44 119 48 Q113 53 107 47 Z" fill="#ff7a1a"/>' +
        '<path d="M109 47 Q112 43 115 44 Q113 47 115 49 Q112 50 109 47 Z" fill="#ffd23f" stroke="none"/>' +
        "</svg>";

      const HINH = {
        trang:
          '<circle cx="100" cy="100" r="70" fill="#ffd23f" stroke="#24163a" stroke-width="6"/><path d="M40 150c10-20 25-20 30-5 8-14 20-14 26 0 6-14 18-14 26 0 5-15 20-15 30 5" fill="#24163a"/>',
        mu: '<path d="M100 20L145 140H55Z" fill="#7b4bb7" stroke="#24163a" stroke-width="6" stroke-linejoin="round"/><ellipse cx="100" cy="148" rx="85" ry="20" fill="#7b4bb7" stroke="#24163a" stroke-width="6"/><rect x="62" y="118" width="76" height="18" fill="#ff7a1a" stroke="#24163a" stroke-width="5"/>',
        den: '<rect x="62" y="61" width="76" height="100" rx="14" fill="#8fd14f" stroke="#24163a" stroke-width="6"/><rect x="70" y="45" width="60" height="16" rx="4" fill="#24163a"/><rect x="70" y="161" width="60" height="14" rx="4" fill="#24163a"/><path d="M100 88q-15 23 0 42q15-19 0-42z" fill="#ff7a1a"/>',
        ma: '<path d="M50 178V92a50 50 0 0 1 100 0v86l-17-14-16 14-17-14-17 14-16-14z" fill="#fff" stroke="#24163a" stroke-width="6" stroke-linejoin="round"/><ellipse cx="82" cy="95" rx="9" ry="13" fill="#24163a"/><ellipse cx="118" cy="95" rx="9" ry="13" fill="#24163a"/>',
        keo: '<polygon points="55,100 15,70 15,130" fill="#ff6fae" stroke="#24163a" stroke-width="6"/><polygon points="145,100 185,70 185,130" fill="#ff6fae" stroke="#24163a" stroke-width="6"/><circle cx="100" cy="100" r="48" fill="#ff6fae" stroke="#24163a" stroke-width="6"/>',
      };

      /* =====================================================================
       Phần dưới đây là code chạy trang – không cần sửa khi đổi chữ
       ===================================================================== */
      const stage = document.getElementById("stage");
      const pagesBox = document.getElementById("pages");
      const dotsBox = document.getElementById("dots");
      const prevBtn = document.querySelector(".js-prev");
      const nextBtn = document.querySelector(".js-next");

      // 1. Đưa chữ vào phong bì
      document.getElementById("heading").textContent = NOI_DUNG.tieuDe;
      document.getElementById("envLabel").textContent = NOI_DUNG.nhanThu;
      document.getElementById("openBtn").textContent = NOI_DUNG.nutMo;

      // 2. Tạo các trang thư từ NOI_DUNG.trang
      NOI_DUNG.trang.forEach((t, i) => {
        const page = document.createElement("article");
        page.className = "page" + (i === 0 ? " active" : "");
        page.innerHTML =
          '<svg class="page-art" viewBox="0 0 200 200">' +
          (HINH[t.hinh] || HINH.trang) +
          "</svg>" +
          '<h2></h2><p class="text"></p>' +
          '<div class="ky-ten"><p class="sign"></p>' +
          RONG +
          "</div>"; // chữ ký + rồng (trang nào cũng có)
        pagesBox.appendChild(page);
        dotsBox.appendChild(document.createElement("span"));
      });
      const pages = pagesBox.querySelectorAll(".page");
      let current = 0;
      let busy = false;

      // 3. Hiệu ứng gõ chữ từng ký tự
      let lanGo = 0; // mỗi lần lật trang tăng số này để dừng lần gõ cũ
      function go1Dong(el, chu, lan) {
        return new Promise((xong) => {
          el.textContent = "";
          el.classList.add("typing");
          const kyTu = [...chu]; // tách đúng cả emoji
          let i = 0;
          const timer = setInterval(() => {
            if (lan !== lanGo) {
              clearInterval(timer);
              el.classList.remove("typing");
              return;
            }
            el.textContent += kyTu[i++] || "";
            if (i >= kyTu.length) {
              clearInterval(timer);
              el.classList.remove("typing");
              xong();
            }
          }, TOC_DO_GO);
        });
      }
      async function goTrang(i) {
        const lan = ++lanGo;
        const t = NOI_DUNG.trang[i];
        const p = pages[i];
        p.querySelectorAll("h2, p").forEach((el) => (el.textContent = ""));
        await go1Dong(p.querySelector("h2"), t.tieuDe, lan);
        if (lan !== lanGo) return;
        await go1Dong(p.querySelector(".text"), t.noiDung, lan);
        if (lan !== lanGo || !t.ky) return;
        await go1Dong(p.querySelector(".sign"), t.ky, lan);
      }

      // 4. Mở / gấp thư
      function openLetter() {
        if (stage.classList.contains("is-open")) return;
        stage.classList.add("is-open");
        setTimeout(phaoKeo, 900); // kẹo bung ra khi thư trượt lên
        setTimeout(() => {
          stage.classList.add("reading");
          goTrang(current);
        }, 1700);
      }
      function closeLetter() {
        lanGo++;
        stage.classList.remove("reading");
        setTimeout(() => stage.classList.remove("is-open"), 500);
      }
      document
        .querySelectorAll(".js-open")
        .forEach((b) => b.addEventListener("click", openLetter));
      document
        .querySelector(".js-close")
        .addEventListener("click", closeLetter);

      // 5. Pháo kẹo bung ra từ phong bì
      function phaoKeo() {
        const box = document.getElementById("envelope").getBoundingClientRect();
        const x = box.left + box.width / 2,
          y = box.top + box.height / 3;
        const loai = ["🍬", "🍭", "🎃", "👻", "🦇", "⭐", "🍫"];
        for (let i = 0; i < 18; i++) {
          const s = document.createElement("span");
          s.className = "burst";
          s.textContent = loai[i % loai.length];
          const goc = Math.random() * Math.PI * 2;
          const xa = 90 + Math.random() * 120;
          s.style.left = x + "px";
          s.style.top = y + "px";
          s.style.setProperty("--bx", Math.cos(goc) * xa + "px");
          s.style.setProperty("--by", Math.sin(goc) * xa - 60 + "px");
          s.style.setProperty("--br", Math.random() * 360 - 180 + "deg");
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1400);
        }
      }

      // 6. Lật trang
      function updateNav() {
        dotsBox
          .querySelectorAll("span")
          .forEach((d, i) => d.classList.toggle("on", i === current));
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === pages.length - 1;
      }
      function go(dir) {
        const target = current + dir;
        if (busy || target < 0 || target >= pages.length) return;
        busy = true;
        const oldPage = pages[current],
          newPage = pages[target];
        const outCls = dir > 0 ? "out-next" : "out-prev";
        const inCls = dir > 0 ? "in-next" : "in-prev";
        oldPage.classList.remove("active");
        oldPage.classList.add("leaving", outCls);
        newPage.classList.add("active", inCls);
        current = target;
        updateNav();
        goTrang(current);
        setTimeout(() => {
          oldPage.classList.remove("leaving", outCls);
          newPage.classList.remove(inCls);
          busy = false;
        }, 620);
      }
      prevBtn.addEventListener("click", () => go(-1));
      nextBtn.addEventListener("click", () => go(1));
      updateNav();

      document.addEventListener("keydown", (e) => {
        if (!stage.classList.contains("reading")) return;
        if (e.key === "ArrowRight") go(1);
        if (e.key === "ArrowLeft") go(-1);
        if (e.key === "Escape") closeLetter();
      });

      // Điện thoại: vuốt để lật trang
      let startX = 0;
      const card = document.getElementById("card");
      card.addEventListener(
        "touchstart",
        (e) => {
          startX = e.touches[0].clientX;
        },
        { passive: true },
      );
      card.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        if (dx < -50) go(1);
        if (dx > 50) go(-1);
      });

      // 7. Bấm vào hình nổi → hình nhảy lên
      document.querySelectorAll(".pop").forEach((el) => {
        el.addEventListener("click", () => {
          el.classList.remove("jump");
          void el.offsetWidth; // mẹo nhỏ để chạy lại animation
          el.classList.add("jump");
        });
        el.addEventListener("animationend", (e) => {
          if (e.animationName === "jump") el.classList.remove("jump");
        });
      });

      // 8. Nền: sao nhấp nháy + lá rơi
      const sky = document.getElementById("sky");
      for (let i = 0; i < 40; i++) {
        const s = document.createElement("span");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 3 + "s";
        sky.appendChild(s);
      }
      const laRoi = ["🍂", "🍁", "✨", "🍂", "🦇"];
      for (let i = 0; i < 12; i++) {
        const f = document.createElement("span");
        f.className = "fall";
        f.textContent = laRoi[i % laRoi.length];
        f.style.left = Math.random() * 100 + "%";
        f.style.fontSize = 14 + Math.random() * 14 + "px";
        f.style.animationDuration = 8 + Math.random() * 8 + "s";
        f.style.animationDelay = -Math.random() * 16 + "s";
        f.style.setProperty("--x", Math.random() * 120 - 60 + "px");
        sky.appendChild(f);
      }
    </script>
  </body>
</html>
